<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <title>Île de Kassa — carte schématique (brouillon v0.1)</title>
  <defs>
    <radialGradient id="mont" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a5a3a"/>
      <stop offset="1" stop-color="#4f7a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mer -->
  <rect width="1000" height="700" fill="#2f7fb0"/>
  <text x="24" y="40" font-size="26" fill="#fff" font-weight="700">ÎLE DE KASSA</text>
  <text x="24" y="64" font-size="14" fill="#dbeefa">Zone de départ — ≈ 2,5 km × 1,6 km — brouillon v0.1</text>

  <!-- Côte vers le continent -->
  <text x="976" y="40" font-size="13" fill="#dbeefa" text-anchor="end">↗ Continent (Lagunaville) ~3 km</text>

  <!-- Île : plage puis terre -->
  <path d="M150,520 C110,440 160,360 250,320 C330,250 420,170 540,150 C650,130 760,140 840,200 C900,250 890,330 830,380 C770,440 700,470 620,500 C520,545 430,600 320,610 C230,615 180,580 150,520 Z" fill="#e9d29a"/>
  <path d="M170,515 C135,445 180,370 260,333 C340,265 425,185 540,166 C645,148 750,158 822,212 C875,255 868,325 815,370 C755,425 690,455 612,485 C515,528 428,585 322,594 C240,598 195,568 170,515 Z" fill="#5e9a45"/>

  <!-- Mangrove NE -->
  <path d="M760,180 C800,170 840,195 850,230 C820,240 790,225 760,215 Z" fill="#2f6b3a" opacity=".9"/>
  <g stroke="#2f7fb0" stroke-width="3" fill="none"><path d="M770,190 C800,205 820,215 845,215"/><path d="M780,210 C805,215 820,228 840,232"/></g>

  <!-- Cocoteraie / plantations nord -->
  <rect x="430" y="185" width="170" height="70" rx="10" fill="#8bbf5a" opacity=".85"/>
  <g fill="#3d6e2a"><circle cx="450" cy="200" r="4"/><circle cx="470" cy="215" r="4"/><circle cx="490" cy="200" r="4"/><circle cx="510" cy="220" r="4"/><circle cx="530" cy="205" r="4"/><circle cx="550" cy="225" r="4"/><circle cx="570" cy="205" r="4"/><circle cx="585" cy="235" r="4"/><circle cx="460" cy="240" r="4"/><circle cx="500" cy="242" r="4"/></g>

  <!-- Mont Kassa -->
  <circle cx="560" cy="340" r="95" fill="url(#mont)"/>
  <circle cx="560" cy="340" r="55" fill="#8a6a48"/>
  <circle cx="560" cy="340" r="22" fill="#5b4330"/>

  <!-- Forêt est -->
  <ellipse cx="720" cy="330" rx="80" ry="60" fill="#3f7a35"/>

  <!-- Routes (piste latérite) -->
  <g stroke="#c0623a" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M275,500 C300,440 330,400 380,385 C430,370 470,400 500,420"/>
    <path d="M275,500 C250,460 230,420 240,380"/>
    <path d="M380,385 C400,320 440,280 480,255"/>
    <path d="M500,420 C580,440 640,420 700,390 C730,375 760,360 780,330"/>
    <path d="M480,255 C560,240 640,230 700,250"/>
    <path d="M700,390 C740,430 770,440 790,450"/>
  </g>
  <!-- Sentier du mont -->
  <path d="M500,420 C520,390 540,370 555,345" stroke="#f2e2b8" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <!-- Piste d'atterrissage -->
  <rect x="600" y="182" width="150" height="16" fill="#b58a5a" transform="rotate(-8 675 190)"/>

  <!-- Lieux -->
  <g font-size="14" fill="#111">
    <!-- Port-Néré -->
    <rect x="230" y="470" width="90" height="70" rx="8" fill="#d9d2c5" stroke="#5b5045" stroke-width="2"/>
    <g fill="#9b8f80"><rect x="240" y="480" width="14" height="12"/><rect x="260" y="485" width="18" height="14"/><rect x="285" y="478" width="12" height="12"/><rect x="300" y="490" width="14" height="16"/><rect x="245" y="505" width="18" height="14"/><rect x="270" y="510" width="14" height="12"/><rect x="292" y="515" width="16" height="12"/></g>
    <rect x="195" y="545" width="70" height="10" fill="#6b5b4b"/>
    <text x="215" y="580" font-weight="700">Port-Néré</text>
    <text x="215" y="596" font-size="11">petite ville · hub · port</text>

    <circle cx="205" cy="400" r="12" fill="#f4c542" stroke="#333"/><text x="120" y="378" font-weight="700">Akwa</text><text x="70" y="394" font-size="11">village de pêcheurs</text>
    <circle cx="420" cy="410" r="12" fill="#f4c542" stroke="#333"/><text x="395" y="450" font-weight="700">Bomé</text><text x="360" y="465" font-size="11">1re coopérative</text>
    <circle cx="730" cy="330" r="12" fill="#f4c542" stroke="#333"/><text x="705" y="305" font-weight="700" fill="#fff">Tiko</text><text x="690" y="365" font-size="11" fill="#fff">otages</text>
    <text x="515" y="262" font-weight="700">Mont Kassa</text><text x="505" y="277" font-size="11">~300 m · antenne radio</text>
    <path d="M565,320 l0,-26 m-6,6 l6,-6 l6,6" stroke="#111" stroke-width="2" fill="none"/>
    <text x="455" y="178" font-weight="700">Cocoteraie / plantations</text>
    <text x="640" y="168" font-size="12" font-weight="700">Piste d'atterrissage</text>
    <text x="800" y="160" font-size="12" font-weight="700" fill="#fff">Mangrove NE</text>

    <!-- Camp du Cobra -->
    <rect x="770" y="420" width="60" height="50" fill="#a33" stroke="#511" stroke-width="3"/>
    <text x="760" y="490" font-weight="700" fill="#fff">Camp du Cobra</text>
    <text x="760" y="506" font-size="11" fill="#fff">ancienne mission · QG</text>

    <!-- Phare -->
    <polygon points="640,520 650,480 660,520" fill="#fff" stroke="#333"/>
    <text x="610" y="540" font-size="12" font-weight="700" fill="#fff">Phare de la Pointe</text>

    <!-- Entrepôt -->
    <rect x="320" y="535" width="40" height="22" fill="#7a6a5a" stroke="#333"/>
    <text x="300" y="625" font-size="11" fill="#fff">Quai &amp; entrepôts</text>
  </g>

  <!-- Bac -->
  <path d="M230,560 C180,630 120,660 60,680" stroke="#fff" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <text x="40" y="660" font-size="12" fill="#fff">Bac ↙ (arrivée du héros)</text>

  <!-- Boussole et échelle -->
  <g transform="translate(930,600)">
    <circle r="32" fill="#fff" opacity=".85"/>
    <polygon points="0,-26 7,0 0,-6 -7,0" fill="#c33"/>
    <polygon points="0,26 7,0 0,6 -7,0" fill="#333"/>
    <text y="-34" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">N</text>
  </g>
  <g transform="translate(720,660)" fill="#fff" font-size="12">
    <rect width="100" height="6" fill="#fff"/><rect x="100" width="100" height="6" fill="#1d4f70"/>
    <text y="22">0</text><text x="88" y="22">330 m</text><text x="186" y="22">670 m</text>
  </g>

  <!-- Légende -->
  <g transform="translate(24,90)" font-size="12" fill="#fff">
    <rect width="190" height="120" rx="8" fill="#000" opacity=".3"/>
    <circle cx="16" cy="20" r="6" fill="#f4c542"/><text x="30" y="24">Village</text>
    <rect x="10" y="36" width="12" height="12" fill="#a33"/><text x="30" y="47">Base ennemie</text>
    <line x1="8" y1="66" x2="24" y2="66" stroke="#c0623a" stroke-width="5"/><text x="30" y="70">Piste en latérite</text>
    <line x1="8" y1="88" x2="24" y2="88" stroke="#f2e2b8" stroke-width="3" stroke-dasharray="4 3"/><text x="30" y="92">Sentier</text>
    <rect x="10" y="102" width="12" height="10" fill="#8bbf5a"/><text x="30" y="112">Champs / plantations</text>
  </g>
</svg>
